# Publishes the catalog to GitHub Pages.
#
# Charts are pushed to master every minute or two, and a deploy takes several
# minutes. GitHub's built-in branch deployment cancels the running deploy on each
# push, so almost none finished. Here a running deploy always finishes and only
# the newest waiting run is kept, so each deploy publishes the latest master.
name: Publish to GitHub Pages

on:
  push:
    branches: [master]
  schedule:
    # Fallback: merges made with GITHUB_TOKEN, such as the periodic cleanup,
    # do not trigger push workflows.
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: master
          fetch-depth: 1
          persist-credentials: false

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
